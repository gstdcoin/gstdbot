Object.assign(TEXT.ru,{"httpsTitle": "HTTPS и Let’s Encrypt", "httpsIntro": "Форма настраивает отдельный HTTPS-прокси к этой ноде. Caddy получает сертификат Let’s Encrypt и автоматически продлевает его. Для исходящей очереди и уже работающего HTTPS-туннеля эта настройка не обязательна.", "httpsPrerequisites": "Нужен ваш домен с публичными A/AAAA-записями на эту машину и доступными из интернета портами 80/443. Настройте DNS и перенаправление портов у себя; форма не изменяет роутер, firewall или чужой веб-сервер. Первичная автоматическая установка помощника поддерживает Debian/Ubuntu с systemd и отдельным пользователем ноды.", "httpsDomain": "Домен ноды", "httpsEmail": "Email для учётной записи Let’s Encrypt", "httpsTerms": "Разрешаю передать домен и email в Let’s Encrypt и принимаю условия ACME-сервиса.", "httpsTermsLink": "Условия Let’s Encrypt ↗", "httpsExposure": "Разрешаю публичный HTTPS-доступ к API и PIN-защищённой панели. Прямые API-запросы расходуют ресурсы без проверки оплаты GSTD и сами не создают наград. Ollama остаётся закрытой.", "httpsInstall": "Настроить HTTPS автоматически", "httpsRefresh": "Проверить HTTPS", "httpsBoundary": "Существующий HTTP-доступ не закрывается автоматически. Проверка сертификата выполняется локально с проверкой имени, цепочки доверия и срока; внешняя доступность NAT отдельно не подтверждается. Рабочий туннель и адрес в реестре автоматически не заменяются. Приватные ключи сертификата остаются у системного HTTPS-сервиса.", "httpsHelper": "Системный компонент HTTPS недоступен. Он подготавливается автоматически при установке ноды с административным доступом. Нажмите «Проверить HTTPS», чтобы повторить проверку; если компонент не восстановился, требуется обслуживание установки. Вводить команды или пароль администратора в панель не нужно.", "httpsUnsupported": "В этой среде встроенная настройка HTTPS недоступна. Используйте уже подключённый защищённый адрес или установку ноды с поддержкой HTTPS. Локальные модели и исходящая очередь про  const parts=[];

 ];

el('newModel').oninput=()=>{el('hfFile').value='';el('installChoice').value='';modelPlan()};
el('refreshCatalog').onclick=async()=>{el('refreshCatalog').disabled=true;try{await loadCatalog(true);notice(t('catalogRefreshed'))}catch(e){notice(errorText(e))}finally{el('refreshCatalog').disabled=false}};
el('send').onclick=async()=>{if(!el('question').value.trim())return;const id=el('model').value;const remote=id!=='auto'&&!installedIds.has(id);const n=catalog?.network?.models.find(m=>m.model_id===id);if(remote&&el('privacy').value!=='network'){notice(t('networkConsent'));return}if(remote&&(!n||n.price_gstd>0)){notice(t(n?'networkPaid':'requested_model_unavailable'));return}el('send').disabled=true;el('answer').textContent=t('working');try{const d=await api('/v1/chat/completions',{model:el('model').value,messages:[{role:'user',content:el('question').value}],privacy:el('privacy').value,max_tokens:512,stream:false});el('answer').textContent=d.choices?.[0]?.message?.content||t('empty')}catch(e){el('answer').textContent=errorText(e)}finally{el('send').disabled=false}};
translate();if(token)refresh().catch(e=>notice(errorText(e)));
setInterval(()=>{if(token&&!document.hidden)status().catch(e=>notice(errorText(e)))},30000);
</script></body></html>
