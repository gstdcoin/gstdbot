function renderReadiness(){
 if(!lastStatus)return;
 const d=lastStatus, p=d.platform||{}, stale=p.lastHeartbeat&&Date.now()-new Date(p.lastHeartbeat).getTime()>300000;
 const runtimeReady=localModels?.ollama_available&&installedIds.size>0;
 const linked=!!rewardCurrent?.address,w=p.worker;
 const workerReady=!!w?.enabled&&!!w.lastPoll&&!w.lastErrorPhase&&!(w.retryAt&&new Date(w.retryAt).getTime()>Date.now());
 const steps=[
  [t('stepModels'),localModels===null?t('checking'):runtimeReady?t('modelsReady')+' '+installedIds.size:t('modelsNeeded'),!!runtimeReady,'#modelsSection',t('openModels')],
  [t('stepRegistration'),!p.registered?t('registrationPending'):stale?t('registrationStale'):t('registrationReady'),!!p.registered&&!stale,null,null],
  [t('stepWallet'),!rewardLoaded?t('checking'):linked?t('walletReady'):t('walletNeeded')+' '+(d.payout_address?t('walletFallback'):''),linked,'#walletSection',t('openWallet')],
  [t('stepQueue'),!w?t('checking'):workerReady?t('queueReady'):w.lastErrorPhase?t('workerError')+': '+t('phase_'+w.lastErrorPhase):w.enabled?t('queueWaiting'):t('workerDisabled'),workerReady,null,null],
  [t('stepCapacity'),d.compute.active<d.compute.capacity?t('capacityReady'):t('capacityBusy'),d.compute.active<d.compute.capacity,'#chatSection',t('testLocal')],
 ];
 el('readinessSteps').replaceChildren();

 const next=(rewardLoaded&&!linked&&!d.payout_address?steps.find(step=>step[0]===t('stepWallet')):null)||steps.find(step=>!step[2]);el('nextAction').textContent=next?t('nextStep')+' '+next[1]:t('nextReady');
 el('directRoute').textContent=t('stepRoute')+': '+(p.publicUrl?t('routeConfigured')+' '+p.publicUrl:t('routeNeeded'));
 if(w){const parts=[t('workerTitle')+': '+t(w.busy?'workerBusy':w.enabled?'workerIdle':'workerDisabled'),t('workerPoll')+': '+(w.lastPoll?new Date(w.lastPoll).toLocaleString(lang):'—'),t('workerResults')+': '+(w.resultsSubmitted||0)];if(w.lastErrorPhase)parts.push(t('workerError')+': '+t('phase_'+w.lastErrorPhase));if(w.retryAt)parts.push(t('workerRetry')+': '+new Date(w.retryAt).toLocaleTimeString(lang));el('workerSummary').textContent=parts.join(' · ')}
}

el('install').onclick=async()=>{const name=el('installChoice').value||el('newModel').value.trim();if(!/^[a-z0-9:._/-]{1,160}$/i.test(name)){notice(t('invalidModel'));return}el('install').disabled=true;el('download').classList.remove('hidden');el('download').removeAttribute('value');el('downloadInfo').textContent=t('working');try{const r=await request('/api/ollama/models/pull',{model:name});if(!r.ok)throw Error((await r.json()).error||t('failed'));const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',success=false;while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';for(const event of events){if(!event.startsWith('data: '))continue;const d=JSON.parse(event.slice(6));if(d.error)throw Error(d.error);if(d.total){el('download').value=Math.round(100*(d.completed||0)/d.total);el('downloadInfo').textContent=el('download').value+'%'}else el('downloadInfo').textContent=t('working');if(d.status==='success')success=true}}if(!success)throw Error(t('failed'));el('downloadInfo').textContent=t('done');await refresh()}catch(e){el('downloadInfo').textContent=errorText(e)}finally{el('install').disabled=false;el('download').classList.add('hidden')}};

async function loadCatalog(refresh=false){const network=catalog?.network;catalog=await api(refresh?'/api/ollama/catalog/refresh':'/api/ollama/catalog',refresh?{}:undefined);if(network!==undefined)catalog.network=network;renderCatalog()}
el('networkRefresh').onclick=async()=>{el('networkRefresh').disabled=true;try{const d=await api('/api/node/model-directory');catalog.network=d.network;renderDirectory();if(!d.network)notice(t('networkUnknown'))}catch(e){notice(errorText(e))}finally{el('networkRefresh').disabled=false}};
function renderDirectory(selectedOverride){
 const selected=selectedOverride??el('model').value;
 const network=catalog.network?.models||[];
 const ids=new Set([...catalog.models.map(m=>m.id),...installedIds,...network.map(m=>m.model_id)]);
 el('directory').replaceChildren();el('model').replaceChildren(new Option(t('autoModel'),'auto'));
 for(const id of ids){
  const local=installedIds.has(id), n=network.find(m=>m.model_id===id), review=catalog.models.find(m=>m.id===id);
  const states=[];if(local)states.push(t('here'));if(n)states.push(t('onNetwork')+' ('+n.nodes_count+')');if(review&&!local&&review.compatibility.status!=='insufficient')states.push(t('downloadable'));
  if(!local&&!n)states.push(catalog.network?t('notAvailable'):t('networkUnknown'));
  const row=document.createElement('p');row.textContent=id+' · '+states.join(' · ')+(n?' · '+n.price_gstd+' GSTD':'');el('directory').append(row);
  if(local||n)el('model').add(new Option(id+' · '+(local?t('here'):t('onNetwork'))+(n&&!local?' · '+n.price_gstd+' GSTD':''),id));
 }
 el('model').value=selected||'auto';networkPlan();
}
function networkPlan(){const id=el('model').value;el('platformChat').setAttribute('href','https://app.gstdtoken.com'+(lang==='ru'?'/ru':'')+'/chat?model='+encodeURIComponent(id));const n=catalog?.network?.models.find(m=>m.model_id===id);el('networkPrice').textContent=n&&!installedIds.has(id)?n.price_gstd+' GSTD · '+t('catalogPrice')+' · '+(n.price_gstd>0?t('networkPaid'):t('networkConsent')):'';}
el('model').onchange=networkPlan;
function renderCatalog(selectedModel){
 const selected=el('installChoice').value;el('installChoice').replaceChildren(new Option(t('chooseModel'),''));
 const h=catalog.hardware;el('catalogHardware').textContent='CPU: '+h.cpu_cores+' · RAM: '+bytes(h.total_ram)+' · '+(h.gpu_name||t('noGpuVerified'))+' · '+(h.disk_free===null?'—':bytes(h.disk_free))+' '+t('freeDisk');
 for(const m of catalog.models){const c=m.compatibility;const option=new Option(m.title+' · '+bytes(m.download_bytes)+' · '+t(c.status)+(installedIds.has(m.id)?' · '+t('installed'):''),m.id);el('installChoice').add(option)}
 el('installChoice').value=selected;if(!selected)el('installChoice').value=catalog.models.find(m=>m.compatibility.status==='fits'&&!m.legacy&&!installedIds.has(m.id))?.id||'';modelPlan();renderDirectory(selectedModel);
}
function modelPlan(){const m=catalog?.models.find(m=>m.id===el('installChoice').value);el('install').disabled=!!m&&(m.compatibility.status==='insufficient'||installedIds.has(m.id));if(!m){el('modelPlan').textContent='';return}const c=m.compatibility;el('modelPlan').textContent=t(c.status)+' · '+t(c.reason)+'\n'+t('estimatedRAM')+': '+bytes(c.estimated_ram_bytes)+' · '+t('downloadSize')+': '+bytes(m.download_bytes)+'\n'+t(c.acceleration==='gpu_candidate'?'gpuCandidate':'cpuCandidate')+'\n'+t(m.legacy?'legacy':'current')+' · '+t('metadataDate')+': '+new Date(m.verified_at).toLocaleDateString(lang);}
el('installChoice').onchange=()=>{el('newModel').value='';modelPlan()};
el('newModel').oninput=()=>{el('installChoice').value='';el('install').disabled=false;el('modelPlan').textContent=t('unknown')};
el('refreshCatalog').onclick=async()=>{el('refreshCatalog').disabled=true;try{await loadCatalog(true);notice(t('catalogRefreshed'))}catch(e){notice(errorText(e))}finally{el('refreshCatalog').disabled=false}};
el('send').onclick=async()=>{if(!el('question').value.trim())return;const id=el('model').value;const remote=id!=='auto'&&!installedIds.has(id);const n=catalog?.network?.models.find(m=>m.model_id===id);if(remote&&el('privacy').value!=='network'){notice(t('networkConsent'));return}if(remote&&(!n||n.price_gstd>0)){notice(t(n?'networkPaid':'requested_model_unavailable'));return}el('send').disabled=true;el('answer').textContent=t('working');try{const d=await api('/v1/chat/completions',{model:el('model').value,messages:[{role:'user',content:el('question').value}],privacy:el('privacy').value,max_tokens:512,stream:false});el('answer').textContent=d.choices?.[0]?.message?.content||t('empty')}catch(e){el('answer').textContent=errorText(e)}finally{el('send').disabled=false}};
translate();if(token)refresh().catch(e=>notice(errorText(e)));
setInterval(()=>{if(token&&!document.hidden)status().catch(e=>notice(errorText(e)))},30000);
